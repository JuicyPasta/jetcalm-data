name: verify

# Scores the published forecast against pilot reports (docs/verification.md)
# and commits the results to main. Every 6 hours because the site keeps only
# about 12 hours of past steps. About a minute a run; the commit says
# [skip ci], so it starts no other workflow.
on:
  schedule:
    - cron: "53 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "numpy>=2.0,<3" "requests>=2.31"

      - name: Fetch the published feed
        run: git clone --quiet --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" site

      - name: Score
        run: python -m jetcalm_data.verify --site site/v1 --out verification --doc docs/verification.md

      - name: Commit the results
        run: |
          git config user.name "jetcalm-data verification"
          git config user.email "actions@users.noreply.github.com"
          git add verification docs/verification.md
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit --quiet -m "Verification $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do
            git pull --quiet --rebase origin main && git push --quiet origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::push failed"; exit 1
